name: Publish PiWire 2.2.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-2.2.0.yml, docs/piwire-2.2.0.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: piwire-v2.2.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check release status
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          sed -e "s|/blob/main/|/blob/${sha}/|g" -e "s|/PiWire/main/|/PiWire/${sha}/|g" docs/piwire-2.2.0.md > release-notes.md
          if gh release view v2.2.0 --json isDraft --jq '.isDraft' > draft-status &&
            [ "$(cat draft-status)" = false ]; then
            gh release edit v2.2.0 --notes-file release-notes.md
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test, build and package
        if: steps.release.outputs.published != 'true'
        run: |
          set -euo pipefail
          cd Source
          test "$(node -p "require('./electron/package.json').version")" = "2.2.0"
          node test.cjs
          for platform in mac windows linux; do
            python3 build.py "$platform"
            python3 package.py "$platform" ../release-assets
          done
          cd ../release-assets
          hdiutil verify PiWire-2.2.0-macOS-universal.dmg
          unzip -tq PiWire-2.2.0-Windows-x64.zip
          tar -tzf PiWire-2.2.0-Linux-x64.tar.gz > /dev/null
          shasum -a 256 PiWire-2.2.0-* > SHA256SUMS.txt
      - name: Publish release
        if: steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=v2.2.0
          if gh release view "$version" --json isDraft --jq '.isDraft' > draft-status; then
            if [ "$(cat draft-status)" != true ]; then
              echo "PiWire 2.2.0 is already published"
              exit 0
            fi
          else
            gh release create "$version" --target "$GITHUB_SHA" --draft --title "PiWire 2.2.0" --notes-file release-notes.md
          fi
          gh release upload "$version" release-assets/* --clobber
          gh release edit "$version" --draft=false --latest
